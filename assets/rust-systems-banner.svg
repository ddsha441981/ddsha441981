<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Accent Glow Filters -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic & Rust Gradients -->
    <linearGradient id="rustGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FF8E3C"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#007ACC"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#30363D" stroke-width="0.7" stroke-dasharray="2,2"/>
      <circle cx="0" cy="0" r="1.5" fill="#484F58"/>
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="900" height="240" rx="12" fill="url(#bgGradient)" stroke="#30363D" stroke-width="1.5"/>
  <rect width="900" height="240" rx="12" fill="url(#circuitGrid)" opacity="0.6"/>

  <!-- Glowing Radial Background Orbs -->
  <circle cx="150" cy="60" r="120" fill="#FF6B00" opacity="0.12" filter="url(#orangeGlow)"/>
  <circle cx="750" cy="180" r="140" fill="#00F0FF" opacity="0.08" filter="url(#cyanGlow)"/>

  <!-- Left Rust Gear Graphic -->
  <g transform="translate(65, 120)">
    <!-- Outer Gear Teeth -->
    <path d="M -45 -12 L -45 12 L -35 12 L -30 25 L -42 37 L -25 54 L -13 42 L 0 47 L 0 57 L 24 57 L 24 47 L 37 42 L 49 54 L 66 37 L 54 25 L 59 12 L 69 12 L 69 -12 L 59 -12 L 54 -25 L 66 -37 L 49 -54 L 37 -42 L 24 -47 L 24 -57 L 0 -57 L 0 -47 L -13 -42 L -25 -54 L -42 -37 L -30 -25 L -35 -12 Z" fill="none" stroke="url(#rustGradient)" stroke-width="2.5" filter="url(#orangeGlow)"/>
    <!-- Inner Silicon Ring -->
    <circle cx="12" cy="0" r="28" fill="#161B22" stroke="#FF8E3C" stroke-width="2"/>
    <!-- Center Core Dot -->
    <circle cx="12" cy="0" r="8" fill="url(#rustGradient)"/>
    <!-- Circuit Connection Rays -->
    <path d="M 40 0 L 110 0 M 12 -28 L 12 -70 M 12 28 L 12 70" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
  </g>

  <!-- Banner Main Typography -->
  <text x="210" y="75" font-family="'JetBrains Mono', Consolas, monospace" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="1">
    RUST &amp; LOW-LEVEL SYSTEMS
  </text>
  <text x="210" y="105" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="14" fill="url(#rustGradient)" letter-spacing="2">
    HARDWARE-AWARE ARCHITECTURES &amp; ZERO-COPY PIPELINES
  </text>

  <!-- Subtitle Tags -->
  <text x="210" y="138" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="13" fill="#8B949E">
    Lock-Free Atomics <tspan fill="#484F58">•</tspan> SIMD Acceleration <tspan fill="#484F58">•</tspan> MIR Compiler Analysis <tspan fill="#484F58">•</tspan> Java 22 FFM
  </text>

  <!-- Divider Line -->
  <line x1="210" y1="155" x2="840" y2="155" stroke="#30363D" stroke-width="1"/>

  <!-- Performance Badges Container -->
  <!-- Badge 1: Throughput -->
  <g transform="translate(210, 172)">
    <rect width="180" height="36" rx="6" fill="#161B22" stroke="#FF6B00" stroke-width="1" opacity="0.9"/>
    <circle cx="18" cy="18" r="4" fill="#FF6B00" filter="url(#orangeGlow)"/>
    <text x="30" y="22" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#E6EDE3">100M+ Ops/sec</text>
    <text x="128" y="22" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#8B949E">CL-TDS</text>
  </g>

  <!-- Badge 2: Vector Speed -->
  <g transform="translate(405, 172)">
    <rect width="195" height="36" rx="6" fill="#161B22" stroke="#00F0FF" stroke-width="1" opacity="0.9"/>
    <circle cx="18" cy="18" r="4" fill="#00F0FF" filter="url(#cyanGlow)"/>
    <text x="30" y="22" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#E6EDE3">4.07M Vecs/sec</text>
    <text x="138" y="22" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#8B949E">Lethe AI</text>
  </g>

  <!-- Badge 3: Contention -->
  <g transform="translate(615, 172)">
    <rect width="195" height="36" rx="6" fill="#161B22" stroke="#3FB950" stroke-width="1" opacity="0.9"/>
    <circle cx="18" cy="18" r="4" fill="#3FB950"/>
    <text x="30" y="22" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#E6EDE3">0 Contention</text>
    <text x="122" y="22" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#8B949E">Lock-Free</text>
  </g>

  <!-- Top Right Branding Tag -->
  <g transform="translate(735, 30)">
    <rect width="125" height="24" rx="12" fill="#FF6B00" opacity="0.15"/>
    <text x="62.5" y="16" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#FF8E3C" text-anchor="middle">RUST 2024</text>
  </g>
</svg>
