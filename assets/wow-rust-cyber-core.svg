<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Cyber Background Gradient -->
    <linearGradient id="wowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Gradients -->
    <linearGradient id="rustFire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <!-- Heavy Neon Glow Filters -->
    <filter id="hyperGlowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hyperGlowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Perspective Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2,4"/>
      <circle cx="0" cy="0" r="1.5" fill="#3B82F6" opacity="0.6"/>
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes orbitRing1 {
        0% { transform: rotateX(65deg) rotateY(15deg) rotateZ(0deg); }
        100% { transform: rotateX(65deg) rotateY(15deg) rotateZ(360deg); }
      }

      @keyframes orbitRing2 {
        0% { transform: rotateX(45deg) rotateY(-30deg) rotateZ(360deg); }
        100% { transform: rotateX(45deg) rotateY(-30deg) rotateZ(0deg); }
      }

      @keyframes orbitRing3 {
        0% { transform: rotateX(75deg) rotateY(45deg) rotateZ(0deg); }
        100% { transform: rotateX(75deg) rotateY(45deg) rotateZ(-360deg); }
      }

      @keyframes pulseCore {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px #FF6B00); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 45px #FF4500); }
      }

      @keyframes waveExpand {
        0% { r: 45px; opacity: 0.8; stroke-width: 3px; }
        100% { r: 160px; opacity: 0; stroke-width: 0.5px; }
      }

      @keyframes particleShoot {
        0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(140px, -90px) scale(1.5); opacity: 0; }
      }

      .ring-1 { transform-origin: 450px 130px; animation: orbitRing1 9s linear infinite; }
      .ring-2 { transform-origin: 450px 130px; animation: orbitRing2 14s linear infinite; }
      .ring-3 { transform-origin: 450px 130px; animation: orbitRing3 7s linear infinite; }
      .quantum-core { transform-origin: 450px 130px; animation: pulseCore 3s ease-in-out infinite; }
      .energy-wave { transform-origin: 450px 130px; animation: waveExpand 4s ease-out infinite; }
      .p-burst-1 { animation: particleShoot 2.5s ease-out infinite; }
      .p-burst-2 { animation: particleShoot 3.2s ease-out infinite 1.1s; }
    </style>
  </defs>

  <!-- Base Space Container -->
  <rect width="900" height="260" rx="16" fill="url(#wowBg)" stroke="#1E293B" stroke-width="2"/>
  <rect width="900" height="260" rx="16" fill="url(#cyberGrid)" opacity="0.85"/>

  <!-- Glowing Radial Space Orbs (Centered) -->
  <circle cx="450" cy="130" r="180" fill="#FF4500" opacity="0.16" filter="url(#hyperGlowOrange)"/>
  <circle cx="450" cy="130" r="120" fill="#00F0FF" opacity="0.12" filter="url(#hyperGlowCyan)"/>

  <!-- Animated Expanding Energy Pulse Wave -->
  <circle cx="450" cy="130" r="45" fill="none" stroke="#FF6B00" class="energy-wave"/>
  <circle cx="450" cy="130" r="45" fill="none" stroke="#00F0FF" class="energy-wave" style="animation-delay: 2s;"/>

  <!-- Star Field -->
  <circle cx="100" cy="40" r="1.5" fill="#60A5FA" opacity="0.8"/>
  <circle cx="220" cy="210" r="2" fill="#38BDF8" opacity="0.6"/>
  <circle cx="780" cy="50" r="1.5" fill="#F472B6" opacity="0.9"/>
  <circle cx="820" cy="220" r="2" fill="#00F0FF" opacity="0.7"/>

  <!-- ==================== CENTERED 3D HOLOGRAPHIC QUANTUM CORE ==================== -->
  <g>
    <!-- Targeting Crosshair Grid & Distance Calibration -->
    <circle cx="450" cy="130" r="120" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4, 4"/>
    <circle cx="450" cy="130" r="90" fill="none" stroke="#334155" stroke-width="0.8"/>
    
    <!-- Cross Axis Lines -->
    <line x1="450" y1="10" x2="450" y2="250" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3, 3"/>
    <line x1="150" y1="130" x2="750" y2="130" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="3, 3"/>

    <!-- Concentric Orbiting Quantum Rings -->
    <!-- Ring 1: Cyan Orbit -->
    <g class="ring-1">
      <ellipse cx="450" cy="130" rx="140" ry="50" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-dasharray="30, 15" filter="url(#hyperGlowCyan)"/>
      <circle cx="590" cy="130" r="7" fill="#00F0FF" filter="url(#hyperGlowCyan)"/>
    </g>

    <!-- Ring 2: Rust Fire Amber Orbit -->
    <g class="ring-2">
      <ellipse cx="450" cy="130" rx="160" ry="55" fill="none" stroke="url(#rustFire)" stroke-width="3" stroke-dasharray="50, 20" filter="url(#hyperGlowOrange)"/>
      <circle cx="290" cy="130" r="8" fill="#FF4500" filter="url(#hyperGlowOrange)"/>
    </g>

    <!-- Ring 3: Electric Violet Orbit -->
    <g class="ring-3">
      <ellipse cx="450" cy="130" rx="120" ry="40" fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="20, 10"/>
      <circle cx="450" cy="90" r="6" fill="#E879F9"/>
    </g>

    <!-- Central Glowing 3D Rust Ferris Core Cog -->
    <g class="quantum-core">
      <!-- Outer Sunburst Teeth Core -->
      <circle cx="450" cy="130" r="46" fill="#0F172A" stroke="url(#rustFire)" stroke-width="4.5" filter="url(#hyperGlowOrange)"/>
      <!-- Inner Crystal Diamond -->
      <polygon points="450,98 482,130 450,162 418,130" fill="url(#rustFire)"/>
      <circle cx="450" cy="130" r="16" fill="#030712" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="450" cy="130" r="7" fill="#00F0FF"/>
    </g>

    <!-- Burst Energy Particles -->
    <circle cx="450" cy="130" r="4" fill="#00F0FF" class="p-burst-1"/>
    <circle cx="450" cy="130" r="5" fill="#FF4500" class="p-burst-2"/>
  </g>
</svg>
