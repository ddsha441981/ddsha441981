<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"
     aria-label="Deendayal's tech stack orbiting a core, grouped into systems, backend and shipping layers" >
  <title>Tech Stack — orbiting a core</title>
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#090c12"/></linearGradient>
    <radialGradient id="sVign" cx="0.7" cy="0.54" r="0.5"><stop offset="0" stop-color="#13203a" stop-opacity="0.6"/><stop offset="1" stop-color="#0a0d14" stop-opacity="0"/></radialGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.72"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.5"/></radialGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,'Courier New',monospace;}
      .sans{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
      .b{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;}
    </style>
  </defs>
  <rect width="1000" height="420" rx="20" fill="url(#sBg)"/>
  <rect width="1000" height="420" rx="20" fill="url(#sVign)"/>
  <rect x="1" y="1" width="998" height="418" rx="19" fill="none" stroke="#1f2a3a" stroke-width="1.5"/>
  <text x="34" y="44" class="mono" font-size="13" fill="#ff6b00">// tech.stack --orbit</text>
  <text x="34" y="74" class="sans" font-size="26" font-weight="800" fill="#e6edf3">The Toolchain</text>
  <line x1="34" y1="92" x2="470" y2="92" stroke="#1f2a3a"/>

  <g>
    <rect x="34" y="122" width="4" height="62" rx="2" fill="#ff6b00"/>
    <text x="54" y="140" class="sans" font-size="20" font-weight="800" fill="#e6edf3">Systems</text>
    <text x="54" y="162" class="mono" font-size="12.5" fill="#cdd9e5">Rust · C++ · Zig</text>
    <text x="54" y="180" class="mono" font-size="11" fill="#8b98a5">// where the speed comes from</text>
  </g>
  <g>
    <rect x="34" y="208" width="4" height="62" rx="2" fill="#6DB33F"/>
    <text x="54" y="226" class="sans" font-size="20" font-weight="800" fill="#e6edf3">Backend</text>
    <text x="54" y="248" class="mono" font-size="12.5" fill="#cdd9e5">Java · Spring Boot</text>
    <text x="54" y="266" class="mono" font-size="11" fill="#8b98a5">// services that stay up</text>
  </g>
  <g>
    <rect x="34" y="294" width="4" height="62" rx="2" fill="#2f81f7"/>
    <text x="54" y="312" class="sans" font-size="20" font-weight="800" fill="#e6edf3">Ship it</text>
    <text x="54" y="334" class="mono" font-size="12.5" fill="#cdd9e5">React · TypeScript · Tauri · Docker · Git</text>
    <text x="54" y="352" class="mono" font-size="11" fill="#8b98a5">// from UI to container</text>
  </g>
  <circle cx="700" cy="225" r="60" fill="none" stroke="#ff6b00" stroke-opacity="0.35" stroke-dasharray="3 7"/>
  <circle cx="700" cy="225" r="116" fill="none" stroke="#6DB33F" stroke-opacity="0.35" stroke-dasharray="3 7"/>
  <circle cx="700" cy="225" r="164" fill="none" stroke="#2f81f7" stroke-opacity="0.35" stroke-dasharray="3 7"/>
  <g>
    <circle cx="700" cy="225" r="34" fill="#ff6b00" opacity="0.12"><animate attributeName="r" values="30;38;30" dur="3s" repeatCount="indefinite"/></circle>
    <rect x="678" y="203" width="44" height="44" rx="9" fill="#111826" stroke="#ff6b00" stroke-width="2"/>
    <text x="700" y="229" text-anchor="middle" class="b" font-size="12" fill="#ff8a2b">CPU</text>
  </g>
  <g>
    <animateMotion dur="16s" begin="-0.00s" repeatCount="indefinite" rotate="0" path="M760,225 A60,60 0 1 1 640,225 A60,60 0 1 1 760,225"/>
    <circle r="24" fill="#ff6b00"/><circle r="24" fill="url(#sphere)"/>
    <text y="4.5" text-anchor="middle" class="b" font-size="13" fill="#fff">Rust</text>
  </g>
  <g>
    <animateMotion dur="16s" begin="-5.33s" repeatCount="indefinite" rotate="0" path="M760,225 A60,60 0 1 1 640,225 A60,60 0 1 1 760,225"/>
    <circle r="24" fill="#00599C"/><circle r="24" fill="url(#sphere)"/>
    <text y="4.5" text-anchor="middle" class="b" font-size="12" fill="#fff">C++</text>
  </g>
  <g>
    <animateMotion dur="16s" begin="-10.67s" repeatCount="indefinite" rotate="0" path="M760,225 A60,60 0 1 1 640,225 A60,60 0 1 1 760,225"/>
    <circle r="24" fill="#F7A41D"/><circle r="24" fill="url(#sphere)"/>
    <text y="4.5" text-anchor="middle" class="b" font-size="12" fill="#0d1117">Zig</text>
  </g>
  <g>
    <animateMotion dur="22s" begin="-0.00s" repeatCount="indefinite" rotate="0" path="M816,225 A116,116 0 1 0 584,225 A116,116 0 1 0 816,225"/>
    <circle r="22" fill="#E76F00"/><circle r="22" fill="url(#sphere)"/>
    <text y="4.5" text-anchor="middle" class="b" font-size="12" fill="#fff">Java</text>
  </g>
  <g>
    <animateMotion dur="22s" begin="-11.00s" repeatCount="indefinite" rotate="0" path="M816,225 A116,116 0 1 0 584,225 A116,116 0 1 0 816,225"/>
    <circle r="22" fill="#6DB33F"/><circle r="22" fill="url(#sphere)"/>
    <text y="3.5" text-anchor="middle" class="b" font-size="10" fill="#fff">Spring</text>
  </g>
  <g>
    <animateMotion dur="30s" begin="-0.00s" repeatCount="indefinite" rotate="0" path="M864,225 A164,164 0 1 1 536,225 A164,164 0 1 1 864,225"/>
    <circle r="22" fill="#61DAFB"/><circle r="22" fill="url(#sphere)"/>
    <text y="3.5" text-anchor="middle" class="b" font-size="10" fill="#0d1117">React</text>
  </g>
  <g>
    <animateMotion dur="30s" begin="-6.00s" repeatCount="indefinite" rotate="0" path="M864,225 A164,164 0 1 1 536,225 A164,164 0 1 1 864,225"/>
    <circle r="22" fill="#3178C6"/><circle r="22" fill="url(#sphere)"/>
    <text y="4.5" text-anchor="middle" class="b" font-size="12" fill="#fff">TS</text>
  </g>
  <g>
    <animateMotion dur="30s" begin="-12.00s" repeatCount="indefinite" rotate="0" path="M864,225 A164,164 0 1 1 536,225 A164,164 0 1 1 864,225"/>
    <circle r="22" fill="#24C8DB"/><circle r="22" fill="url(#sphere)"/>
    <text y="3.5" text-anchor="middle" class="b" font-size="10" fill="#0d1117">Tauri</text>
  </g>
  <g>
    <animateMotion dur="30s" begin="-18.00s" repeatCount="indefinite" rotate="0" path="M864,225 A164,164 0 1 1 536,225 A164,164 0 1 1 864,225"/>
    <circle r="22" fill="#2496ED"/><circle r="22" fill="url(#sphere)"/>
    <text y="3.5" text-anchor="middle" class="b" font-size="9" fill="#fff">Docker</text>
  </g>
  <g>
    <animateMotion dur="30s" begin="-24.00s" repeatCount="indefinite" rotate="0" path="M864,225 A164,164 0 1 1 536,225 A164,164 0 1 1 864,225"/>
    <circle r="22" fill="#F05032"/><circle r="22" fill="url(#sphere)"/>
    <text y="4.5" text-anchor="middle" class="b" font-size="12" fill="#fff">Git</text>
  </g>
</svg>