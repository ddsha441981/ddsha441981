<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%">
  <defs>
    <style>
      .bg { fill: #1e1e1e; rx: 8px; ry: 8px; }
      .header { fill: #252526; rx: 8px; ry: 8px; }
      .border { fill: none; stroke: #333333; stroke-width: 1.5; rx: 8px; ry: 8px; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title-text { fill: #858585; font-family: 'JetBrains Mono', 'Fira Code', 'Ubuntu Mono', Consolas, monospace; font-size: 13px; font-weight: 600; }
      .term-text { font-family: 'JetBrains Mono', 'Fira Code', 'Ubuntu Mono', Consolas, monospace; font-size: 13.5px; line-height: 1.6; }
      .prompt-usr { fill: #4ec9b0; font-weight: bold; }
      .prompt-path { fill: #569cd6; font-weight: bold; }
      .prompt-cmd { fill: #ce9178; }
      .flag { fill: #9cdcfe; }
      .log-info { fill: #6a9955; }
      .log-sum { fill: #dcdcaa; font-weight: bold; }
      .log-val { fill: #b5cea8; }
      .cursor { fill: #4ec9b0; animation: blink 1s step-start infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Main Box Background -->
  <rect x="0" y="0" width="900" height="330" class="bg" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="900" height="36" class="header" />
  
  <!-- Traffic Light Window Buttons -->
  <circle cx="20" cy="18" r="6" class="dot-red" />
  <circle cx="40" cy="18" r="6" class="dot-yellow" />
  <circle cx="60" cy="18" r="6" class="dot-green" />
  
  <!-- Window Title -->
  <text x="450" y="23" text-anchor="middle" class="title-text">Terminal — ddsha441981@ddsha441981-Latitude-7490: ~</text>

  <!-- Border Frame -->
  <rect x="0" y="0" width="900" height="330" class="border" />

  <!-- Terminal Content Lines -->
  <g class="term-text" transform="translate(20, 65)">
    <!-- Command Prompt -->
    <text y="0">
      <tspan class="prompt-usr">ddsha441981@ddsha441981-Latitude-7490</tspan>:<tspan class="prompt-path">~</tspan>$ <tspan class="prompt-cmd">systems-suite-verify</tspan> <tspan class="flag">--all-projects --release</tspan>
    </text>

    <!-- Execution Output Logs -->
    <text y="26" class="log-info">[INFO] [Project Lethe] Bio-Inspired Edge AI: 4.07M vectors/sec (O(1) Welford EMA) ... OK</text>
    <text y="50" class="log-info">[INFO] [LineFault] MIR Static Analysis &amp; False-Sharing Hazard Checker ... OK</text>
    <text y="74" class="log-info">[INFO] [WireDoctor] Spring Boot Diagnostics &amp; Tarjan SCC CI Gate Engine ... OK</text>
    <text y="98" class="log-info">[INFO] [CL-TDS] 1MB L3 Cache-Locked Sketch (100M+ ops/sec, 0 Lock Contention) ... OK</text>
    <text y="122" class="log-info">[INFO] [GodseYe] 5-Layer DWM Display Affinity &amp; Zero-Copy Audio VAD Loop ... OK</text>

    <!-- Summary Section -->
    <text y="152" class="log-sum">[SUMMARY] Executing 10-Project Portfolio Validation Suite:</text>
    <text y="176" fill="#cccccc">&nbsp;&nbsp;├── Memory Footprint : <tspan class="log-val">Strictly Bounded O(1) Memory Models</tspan></text>
    <text y="200" fill="#cccccc">&nbsp;&nbsp;├── Mutex Contention : <tspan class="log-val">0 (Lock-Free Atomics &amp; Zero-Copy Pipelines)</tspan></text>
    <text y="224" fill="#cccccc">&nbsp;&nbsp;├── Interop Overhead : <tspan class="log-val">1.2ns (Java 22 FFM / Win32 FFI Bindings)</tspan></text>
    <text y="248" fill="#cccccc">&nbsp;&nbsp;└── System Status &nbsp;&nbsp;&nbsp;: ⚡ <tspan class="prompt-usr">ALL 10 PROJECTS VERIFIED &amp; OPERATIONAL</tspan></text>

    <!-- End Prompt with Blinking Cursor -->
    <text y="278">
      <tspan class="prompt-usr">ddsha441981@ddsha441981-Latitude-7490</tspan>:<tspan class="prompt-path">~</tspan>$ <tspan class="cursor">_</tspan>
    </text>
  </g>
</svg>
