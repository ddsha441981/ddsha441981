        <text x="0" y="336">     . ^['' %@%@@HH%b%k{illjkjj%%% ;  `.</text>
        <text x="0" y="350">    =[' `  . %HH%%%%H@gkilljjj%kk%".   'i</text>
      </g>
    </g>

    <!-- Bottom Cyber Corner Decorator -->
    <path d="M 10 415 L 40 415 M 10 415 L 10 395" stroke="#ff7b00" stroke-width="2" fill="none" />
    <path d="M 365 415 L 335 415 M 365 415 L 365 395" stroke="#00f2fe" stroke-width="2" fill="none" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="405" y1="50" x2="405" y2="475" stroke="#21262d" stroke-width="1.5" />

