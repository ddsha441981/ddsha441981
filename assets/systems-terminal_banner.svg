<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%">
  <defs>
    <!-- Dark Cyber Gradients -->
    <linearGradient id="termBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <!-- Glowing Cyber Beam -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0" />
    </linearGradient>

    <filter id="asciiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .term-body { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 11.5px; }
      
      /* ASCII Image Animation Engine */
      .ascii-art { font-family: 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 10px; line-height: 1.15; font-weight: 600; }
      
      .ascii-head { fill: #ff7b00; animation: asciiPulse 3s ease-in-out infinite alternate; }
      .ascii-mid { fill: #00f2fe; animation: asciiColorShift 4s ease-in-out infinite alternate; }
      .ascii-base { fill: #00e676; animation: asciiPulse 3s ease-in-out infinite alternate 1.5s; }
      .ascii-accent { fill: #bc8cff; }

      @keyframes asciiPulse {
        0% { opacity: 0.8; filter: drop-shadow(0 0 2px #ff7b00); }
        100% { opacity: 1; filter: drop-shadow(0 0 8px #ff7b00); }
      }

      @keyframes asciiColorShift {
        0% { fill: #00f2fe; filter: drop-shadow(0 0 2px #00f2fe); }
        50% { fill: #3fb950; filter: drop-shadow(0 0 6px #3fb950); }
        100% { fill: #ff7b00; filter: drop-shadow(0 0 8px #ff7b00); }
      }

      /* Scanning Cyber Laser Line Across ASCII Image */
      .scan-beam { animation: scanLine 3.5s linear infinite; }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateY(380px); opacity: 0; }
      }

      /* Fastfetch Info Colors */
      .hdr-title { font-weight: bold; fill: #ff7b00; letter-spacing: 0.5px; }
      .hdr-line { fill: #30363d; }
      .lbl { fill: #8b949e; }
      .lbl-key { fill: #ffa657; font-weight: bold; }
      .val-bright { fill: #f0f6fc; font-weight: 600; }
      .val-cyan { fill: #58a6ff; }
      .val-green { fill: #3fb950; font-weight: bold; }
      .val-orange { fill: #ffa657; }
      .val-red { fill: #ff7b72; }
      .val-purple { fill: #bc8cff; }

      /* Sequential Fade In Animations */
      .fade-l1 { animation: fadeIn 10s ease-in-out infinite 0.2s; }
      .fade-l2 { animation: fadeIn 10s ease-in-out infinite 0.5s; }
      .fade-l3 { animation: fadeIn 10s ease-in-out infinite 0.8s; }
      .fade-l4 { animation: fadeIn 10s ease-in-out infinite 1.1s; }
      .fade-l5 { animation: fadeIn 10s ease-in-out infinite 1.4s; }
      .fade-l6 { animation: fadeIn 10s ease-in-out infinite 1.7s; }

      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(2px); }
        10%, 92% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }

      .cursor { fill: #58a6ff; animation: blink 0.8s step-start infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="980" height="500" rx="12" ry="12" fill="url(#termBgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Window Header -->
  <rect x="0" y="0" width="980" height="38" rx="12" ry="12" fill="url(#headerGrad)" />
  <line x1="0" y1="38" x2="980" y2="38" stroke="#30363d" stroke-width="1.5" />

  <!-- Window Control Buttons -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="19" r="5.5" fill="#27c93f" />

  <!-- Window Header Title -->
  <text x="490" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8b949e">
    ddsha441981@ddsha441981-Latitude-7490: ~
  </text>

  <!-- ==================== LEFT COLUMN: ANIMATED ASCII PORTRAIT IMAGE ==================== -->
  <g transform="translate(15, 45)">
    <!-- Cyber Frame Box for Animated ASCII Art -->
