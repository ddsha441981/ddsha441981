<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img"
     aria-label="About Deendayal — capabilities, interests and stack" >
  <title>About / Life</title>
  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="aBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b00"/><stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,'Courier New',monospace;}
      .sans{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
      .cap{transform:scaleX(0);transform-origin:left;animation:agrow 1s ease-out forwards;}
      @keyframes agrow{to{transform:scaleX(1)}}
      .c2{animation-delay:.15s}.c3{animation-delay:.3s}.c4{animation-delay:.45s}.c5{animation-delay:.6s}
      .chip{opacity:0;animation:achip .5s ease-out forwards;}
      @keyframes achip{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.cap{transform:scaleX(1)}.chip{opacity:1}}
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="340" rx="20" fill="url(#aBg)"/>
  <rect x="1" y="1" width="998" height="338" rx="19" fill="none" stroke="#1f2a3a" stroke-width="1.5"/>
  <text x="34" y="46" class="mono" font-size="13" fill="#ff6b00">// about.life</text>
  <text x="34" y="76" class="sans" font-size="26" font-weight="800" fill="#e6edf3">What I Do &amp; What Drives Me</text>
  <line x1="34" y1="92" x2="966" y2="92" stroke="#1f2a3a"/>

  <!-- LEFT: proof, not self-rated percentages -->
  <g class="chip" style="animation-delay:0.1s">
    <rect x="34" y="106" width="192" height="90" rx="12" fill="#111826" stroke="#2a3650"/>
    <rect x="34" y="122" width="3" height="58" rx="1.5" fill="url(#aBar)"/>
    <text x="52" y="146" class="sans" font-size="34" font-weight="800" fill="#e6edf3">100M+</text>
    <text x="52" y="166" class="mono" font-size="12" fill="#9fb0c3">ops/sec</text>
    <text x="52" y="183" class="mono" font-size="10.5" fill="#ff6b00">CL-TDS · 1 MB sketch</text>
  </g>
  <g class="chip" style="animation-delay:0.2s">
    <rect x="242" y="106" width="192" height="90" rx="12" fill="#111826" stroke="#2a3650"/>
    <rect x="242" y="122" width="3" height="58" rx="1.5" fill="url(#aBar)"/>
    <text x="260" y="146" class="sans" font-size="34" font-weight="800" fill="#e6edf3">4M</text>
    <text x="260" y="166" class="mono" font-size="12" fill="#9fb0c3">vectors/sec on CPU</text>
    <text x="260" y="183" class="mono" font-size="10.5" fill="#ff6b00">Project Lethe</text>
  </g>
  <g class="chip" style="animation-delay:0.3s">
    <rect x="34" y="208" width="192" height="90" rx="12" fill="#111826" stroke="#2a3650"/>
    <rect x="34" y="224" width="3" height="58" rx="1.5" fill="url(#aBar)"/>
    <text x="52" y="248" class="sans" font-size="34" font-weight="800" fill="#e6edf3">10</text>
    <text x="52" y="268" class="mono" font-size="12" fill="#9fb0c3">public projects</text>
    <text x="52" y="285" class="mono" font-size="10.5" fill="#ff6b00">Rust · Java · AI</text>
  </g>
  <g class="chip" style="animation-delay:0.4s">
    <rect x="242" y="208" width="192" height="90" rx="12" fill="#111826" stroke="#2a3650"/>
    <rect x="242" y="224" width="3" height="58" rx="1.5" fill="url(#aBar)"/>
    <text x="260" y="248" class="sans" font-size="34" font-weight="800" fill="#e6edf3">64 B</text>
    <text x="260" y="268" class="mono" font-size="12" fill="#9fb0c3">one cache line</text>
    <text x="260" y="285" class="mono" font-size="10.5" fill="#ff6b00">LineFault</text>
  </g>

  <line x1="482" y1="104" x2="482" y2="312" stroke="#1f2a3a"/>

  <!-- RIGHT: interests carousel -->
  <text x="500" y="124" class="mono" font-size="11" fill="#8b98a5">INTERESTS — auto-cycling</text>
  <g>
    <rect x="500" y="132" width="150" height="5" rx="2.5" fill="#1a2130"/>
    <rect x="500" y="132" width="0" height="5" rx="2.5" fill="#ff6b00"><animate attributeName="width" values="0;150;0;0" keyTimes="0;0.333;0.334;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="660" y="132" width="150" height="5" rx="2.5" fill="#1a2130"/>
    <rect x="660" y="132" width="0" height="5" rx="2.5" fill="#ff6b00"><animate attributeName="width" values="0;150;0;0" keyTimes="0;0.333;0.334;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect>
    <rect x="820" y="132" width="146" height="5" rx="2.5" fill="#1a2130"/>
    <rect x="820" y="132" width="0" height="5" rx="2.5" fill="#ff6b00"><animate attributeName="width" values="0;146;0;0" keyTimes="0;0.333;0.334;1" dur="12s" begin="8s" repeatCount="indefinite"/></rect>
  </g>

  <g opacity="1"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.31;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    <text x="500" y="186" font-size="34">🚀</text>
    <text x="552" y="174" class="sans" font-size="19" font-weight="800" fill="#e6edf3">Systems &amp; Performance</text>
    <text x="552" y="196" class="mono" font-size="12" fill="#ff6b00">// the metal layer</text>
    <text x="500" y="236" class="mono" font-size="12.5" fill="#9fb0c3">SIMD vectorization, cache-line locking and</text>
    <text x="500" y="258" class="mono" font-size="12.5" fill="#9fb0c3">lock-free atomics. Hot data pinned in 1&#8201;MB</text>
    <text x="500" y="280" class="mono" font-size="12.5" fill="#9fb0c3">of L3, pushing 100M+ ops/sec.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.31;0.33;1" dur="12s" begin="4s" repeatCount="indefinite"/>
    <text x="500" y="186" font-size="34">🧠</text>
    <text x="552" y="174" class="sans" font-size="19" font-weight="800" fill="#e6edf3">Bio-Inspired AI</text>
    <text x="552" y="196" class="mono" font-size="12" fill="#ff6b00">// memory that won't forget</text>
    <text x="500" y="236" class="mono" font-size="12.5" fill="#9fb0c3">Zero-forgetting edge architectures and</text>
    <text x="500" y="258" class="mono" font-size="12.5" fill="#9fb0c3">continual learning. Project Lethe runs</text>
    <text x="500" y="280" class="mono" font-size="12.5" fill="#9fb0c3">4M vectors/sec on a plain CPU.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.31;0.33;1" dur="12s" begin="8s" repeatCount="indefinite"/>
    <text x="500" y="186" font-size="34">📖</text>
    <text x="552" y="174" class="sans" font-size="19" font-weight="800" fill="#e6edf3">Open-Source &amp; Research</text>
    <text x="552" y="196" class="mono" font-size="12" fill="#ff6b00">// building in public</text>
    <text x="500" y="236" class="mono" font-size="12.5" fill="#9fb0c3">Published Rust crates and Zenodo DOI</text>
    <text x="500" y="258" class="mono" font-size="12.5" fill="#9fb0c3">papers, plus writing on dev.to &amp; Medium</text>
    <text x="500" y="280" class="mono" font-size="12.5" fill="#9fb0c3">about low-level performance.</text>
  </g>

  <!-- stack chips -->
  <g class="mono" font-size="11.5" fill="#cdd9e5">
    <g class="chip" style="animation-delay:.2s"><rect x="34" y="312" width="52" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="60" y="327" text-anchor="middle">Rust</text></g>
    <g class="chip" style="animation-delay:.3s"><rect x="92" y="312" width="52" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="118" y="327" text-anchor="middle">Java</text></g>
    <g class="chip" style="animation-delay:.4s"><rect x="150" y="312" width="48" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="174" y="327" text-anchor="middle">C++</text></g>
    <g class="chip" style="animation-delay:.5s"><rect x="204" y="312" width="46" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="227" y="327" text-anchor="middle">Zig</text></g>
    <g class="chip" style="animation-delay:.6s"><rect x="256" y="312" width="92" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="302" y="327" text-anchor="middle">Spring Boot</text></g>
    <g class="chip" style="animation-delay:.7s"><rect x="354" y="312" width="56" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="382" y="327" text-anchor="middle">Tauri</text></g>
    <g class="chip" style="animation-delay:.8s"><rect x="416" y="312" width="62" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="447" y="327" text-anchor="middle">Docker</text></g>
    <g class="chip" style="animation-delay:.9s"><rect x="484" y="312" width="58" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="513" y="327" text-anchor="middle">React</text></g>
    <g class="chip" style="animation-delay:1s"><rect x="548" y="312" width="54" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="575" y="327" text-anchor="middle">Linux</text></g>
    <g class="chip" style="animation-delay:1.1s"><rect x="608" y="312" width="78" height="22" rx="11" fill="#111826" stroke="#2a3650"/><text x="647" y="327" text-anchor="middle">TypeScript</text></g>
  </g>
</svg>
