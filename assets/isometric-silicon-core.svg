<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090E"/>
      <stop offset="50%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowViolet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="isoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161F2E" stroke-width="0.8"/>
      <circle cx="15" cy="15" r="1" fill="#253449"/>
    </pattern>

    <!-- CSS Keyframes -->
    <style>
      @keyframes floatCore {
        0%, 100% { transform: translateY(0px) rotateX(20deg) rotateZ(-25deg); }
        50% { transform: translateY(-12px) rotateX(22deg) rotateZ(-23deg); }
      }

      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }

      @keyframes fadeParticle {
        0% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 0.9; }
        100% { transform: translateY(-45px); opacity: 0; }
      }

      @keyframes codeScroll {
        0% { transform: translateY(0); }
        100% { transform: translateY(-60px); }
      }

      .floating-processor {
        transform-origin: 750px 120px;
        animation: floatCore 5s ease-in-out infinite;
      }

      .pulsing-wave {
        transform-origin: 750px 140px;
        animation: pulseRing 3.5s ease-in-out infinite;
      }

      .particle-1 { animation: fadeParticle 2.8s ease-in-out infinite; }
      .particle-2 { animation: fadeParticle 3.4s ease-in-out infinite 0.9s; }
      .particle-3 { animation: fadeParticle 2.2s ease-in-out infinite 1.5s; }

      .scroll-text { animation: codeScroll 6s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="14" fill="url(#cyberBg)" stroke="#161F2E" stroke-width="1.5"/>
  <rect width="900" height="240" rx="14" fill="url(#isoGrid)" opacity="0.8"/>

  <!-- Left: Cyberpunk Monospace Quote & Hex Stream -->
  <g transform="translate(45, 45)">
    <!-- Hex Opcode Stream Background Box -->
    <rect width="130" height="150" rx="8" fill="#090D14" stroke="#1E2A3C" stroke-width="1"/>
    <g transform="translate(12, 20)">
      <text font-family="'JetBrains Mono', monospace" font-size="10" fill="#485B75" line-height="1.6">
        <tspan x="0" y="0">0x7FFF08</tspan>
        <tspan x="0" y="16">AVX512_F</tspan>
        <tspan x="0" y="32">FENCE_SC</tspan>
        <tspan x="0" y="48">CAS_LOCK</tspan>
        <tspan x="0" y="64">L3_BOUND</tspan>
        <tspan x="0" y="80">WAKER_VT</tspan>
        <tspan x="0" y="96">SIMD_VEC</tspan>
        <tspan x="0" y="112">0x00FF8C</tspan>
      </text>
    </g>

    <!-- Main Philosophy Text -->
    <g transform="translate(155, 20)">
      <text font-family="'JetBrains Mono', monospace" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="1">
        HARDWARE intuition
      </text>
      <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="url(#amberGrad)" letter-spacing="2">
        SYNTAX IS CHEAP. INTUITION IS EXPENSIVE.
      </text>
      <text x="0" y="55" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#8B98A9">
        Exploring silicon limits through lock-free concurrency &amp; low-level assembly.
      </text>

      <!-- Tech Tag Capsules -->
      <g transform="translate(0, 75)">
        <!-- Capsule 1 -->
        <rect width="115" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-width="0.8"/>
        <text x="57.5" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF9E00" text-anchor="middle">AVX-512 SIMD</text>

        <!-- Capsule 2 -->
        <rect x="125" width="125" height="26" rx="13" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-width="0.8"/>
        <text x="187.5" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" text-anchor="middle">LOCK-FREE ATOMICS</text>

        <!-- Capsule 3 -->
        <rect x="260" width="110" height="26" rx="13" fill="#9D4EDD" fill-opacity="0.15" stroke="#9D4EDD" stroke-width="0.8"/>
        <text x="315" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#C77DFF" text-anchor="middle">L3 CACHE-LOCK</text>
      </g>
    </g>
  </g>

  <!-- Right: Floating 3D Isometric Processor Die -->
  <!-- Outer Glow Ring -->
  <ellipse cx="740" cy="150" rx="90" ry="45" fill="none" stroke="url(#violetGrad)" stroke-width="2" class="pulsing-wave"/>

  <!-- Floating Particles -->
  <circle cx="720" cy="120" r="3" fill="#00F0FF" filter="url(#glowCyan)" class="particle-1"/>
  <circle cx="760" cy="100" r="4" fill="#FF6B00" filter="url(#glowAmber)" class="particle-2"/>
  <circle cx="740" cy="80" r="2.5" fill="#C77DFF" filter="url(#glowViolet)" class="particle-3"/>

  <!-- Isometric 3D Microprocessor Block -->
  <g class="floating-processor">
    <!-- Base Shadow Plate -->
    <polygon points="740,40 820,80 740,120 660,80" fill="#0A0F18" stroke="#1E2A3C" stroke-width="2"/>

    <!-- Processor Die Layers -->
    <!-- Layer 1: Substrate -->
    <polygon points="740,30 820,70 740,110 660,70" fill="#121A28" stroke="#9D4EDD" stroke-width="1.5" filter="url(#glowViolet)"/>
    
    <!-- Layer 2: Silicon Core -->
    <polygon points="740,20 800,50 740,80 680,50" fill="url(#amberGrad)" opacity="0.9" filter="url(#glowAmber)"/>

    <!-- Core Grid Matrix Traces -->
    <line x1="710" y1="45" x2="770" y2="45" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <line x1="740" y1="30" x2="740" y2="60" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Central Core Crystal -->
    <polygon points="740,28 755,36 740,44 725,36" fill="#00F0FF" filter="url(#glowCyan)"/>
  </g>
</svg>
