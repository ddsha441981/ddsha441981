<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 292" width="450" height="292" role="img" aria-label="GodsEye - Tauri 2.0 DWM stealth &amp; VAD engine." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GodsEye</title>
  <defs>
    <style>
      .sans{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
      .b{font-family:'JetBrains Mono',ui-monospace,'Courier New',monospace;font-weight:700;}
      .e{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;}
    </style>
    <linearGradient id="c8face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf1f6"/></linearGradient>
    <radialGradient id="c8glow" cx="0.85" cy="0.1" r="0.8"><stop offset="0" stop-color="#24C8DB" stop-opacity="0.16"/><stop offset="1" stop-color="#24C8DB" stop-opacity="0"/></radialGradient>
    <linearGradient id="c8hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0.18"/></linearGradient>
    <linearGradient id="c8shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#24C8DB" stop-opacity="0"/><stop offset="0.5" stop-color="#24C8DB" stop-opacity="0.10"/><stop offset="1" stop-color="#24C8DB" stop-opacity="0"/></linearGradient>
    <linearGradient id="c8tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5bd6e4"/><stop offset="1" stop-color="#12646e"/></linearGradient>
    <pattern id="c8scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.025"/></pattern>
    <clipPath id="c8clip"><rect x="25" y="22" width="400" height="220" rx="18"/></clipPath>
    <filter id="c8b" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="c8b3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- floor shadow + coloured light spill -->
  <ellipse cx="231" cy="269" rx="184" ry="9" fill="#000" opacity="0.22" filter="url(#c8b)">
    <animate attributeName="rx" values="184;160;184" dur="5s" begin="-1.6s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="225" cy="267" rx="136" ry="7" fill="#24C8DB" opacity="0.16" filter="url(#c8b)"/>

  <g transform="translate(225.0 132.0) skewY(-2.6) scale(0.97 1) translate(-225.0 -132.0)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" begin="-1.6s" repeatCount="indefinite"/>
      <rect x="34.0" y="35.0" width="400" height="220" rx="18" fill="#92e4ed"/><rect x="33.0" y="33.6" width="400" height="220" rx="18" fill="#91e2eb"/><rect x="32.0" y="32.1" width="400" height="220" rx="18" fill="#8fe0e9"/><rect x="31.0" y="30.7" width="400" height="220" rx="18" fill="#8edee7"/><rect x="30.0" y="29.2" width="400" height="220" rx="18" fill="#8ddce5"/><rect x="29.0" y="27.8" width="400" height="220" rx="18" fill="#8cdae2"/><rect x="28.0" y="26.3" width="400" height="220" rx="18" fill="#8ad8e0"/><rect x="27.0" y="24.9" width="400" height="220" rx="18" fill="#89d6de"/><rect x="26.0" y="23.4" width="400" height="220" rx="18" fill="#88d4dc"/><rect x="34.0" y="35.0" width="400" height="220" rx="18" fill="none" stroke="#24C8DB" stroke-opacity="0.55" stroke-width="1.2"/>

      <!-- front face -->
      <rect x="25" y="22" width="400" height="220" rx="18" fill="url(#c8face)"/>
      <rect x="25" y="22" width="400" height="220" rx="18" fill="url(#c8glow)"/>
      <rect x="25" y="22" width="400" height="220" rx="18" fill="url(#c8scan)"/>

      <g clip-path="url(#c8clip)">
        <!-- faint orbit rings, top-right -->
        <g transform="translate(363 80)" fill="none" stroke="#24C8DB">
          <circle r="34" stroke-opacity="0.22" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="26s" repeatCount="indefinite"/></circle>
          <circle r="52" stroke-opacity="0.14" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="38s" repeatCount="indefinite"/></circle>
          <circle r="70" stroke-opacity="0.09"/>
        </g>
        <!-- light sweep -->
        <g><animateTransform attributeName="transform" type="translate" values="-150 0;-150 0;550 0" keyTimes="0;0.55;1" dur="7s" begin="-2.6s" repeatCount="indefinite"/>
          <rect x="-15" y="12" width="90" height="240" fill="url(#c8shine)" transform="skewX(-22)"/></g>
      </g>

      <!-- top-edge highlight + neon border -->
      <path d="M43,23.5 H407" stroke="#fff" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="25" y="22" width="400" height="220" rx="18" fill="none" stroke="#24C8DB" stroke-width="3" opacity="0.4" filter="url(#c8b3)"/>
      <rect x="25" y="22" width="400" height="220" rx="18" fill="none" stroke="#24C8DB" stroke-opacity="0.8" stroke-width="1.4"/>

      <!-- icon tile (little extruded block) -->
      <g transform="translate(51 48)">
        <rect x="5" y="7" width="58" height="58" rx="15" fill="#0a383d"/>
        <rect x="2.5" y="3.5" width="58" height="58" rx="15" fill="#12646e"/>
        <rect width="58" height="58" rx="15" fill="url(#c8tile)"/>
        <rect width="58" height="58" rx="15" fill="none" stroke="#fff" stroke-opacity="0.45"/>
        <text x="29" y="40" text-anchor="middle" class="e" font-size="30">👁️</text>
      </g>

      <!-- title -->
      <text x="129" y="72" class="sans" font-size="22" font-weight="800" fill="#1f2328">GodsEye</text>
      <rect x="129" y="82" width="81" height="3" rx="1.5" fill="#24C8DB"/>
      <g transform="translate(25 20)"><text x="26" y="116" class="sans" font-size="14" fill="#57606a">Tauri 2.0 DWM stealth &amp; VAD engine.</text></g>
      <line x1="51" y1="172" x2="399" y2="172" stroke="#d0d7de"/>
      <g transform="translate(25 22)"><g transform="translate(26 172)"><rect width="60" height="28" rx="14" fill="#ffffff" stroke="#24C8DB" stroke-opacity="0.55"/><circle cx="15" cy="14" r="4" fill="#24C8DB"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-2.96s" repeatCount="indefinite"/></circle><text x="26" y="18.5" class="b" font-size="12" fill="#1f2328">Rust</text></g><g transform="translate(96 172)"><rect width="89" height="28" rx="14" fill="#24C8DB"/><rect width="89" height="28" rx="14" fill="url(#c8hi)"/><text x="44" y="18.5" text-anchor="middle" class="b" font-size="12" fill="#0d1117">Tauri 2.0</text></g></g>

      <!-- corner brackets -->
      <path d="M385,36 H411 V62" fill="none" stroke="#24C8DB" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
      <path d="M385,228 H411 V202" fill="none" stroke="#24C8DB" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>
