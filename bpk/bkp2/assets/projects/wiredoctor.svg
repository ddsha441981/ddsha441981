<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 292" width="450" height="292" role="img" aria-label="WireDoctor - Spring Boot context diagnostics &amp; CI gating.">
  <title>WireDoctor</title>
  <defs>
    <style>
      .sans{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
      .b{font-family:'JetBrains Mono',ui-monospace,'Courier New',monospace;font-weight:700;}
      .e{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;}
    </style>
    <linearGradient id="c2face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2535"/><stop offset="1" stop-color="#0d1320"/></linearGradient>
    <radialGradient id="c2glow" cx="0.85" cy="0.1" r="0.8"><stop offset="0" stop-color="#6DB33F" stop-opacity="0.34"/><stop offset="1" stop-color="#6DB33F" stop-opacity="0"/></radialGradient>
    <linearGradient id="c2hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0.18"/></linearGradient>
    <linearGradient id="c2shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="c2tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#92c66f"/><stop offset="1" stop-color="#365a20"/></linearGradient>
    <pattern id="c2scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity="0.035"/></pattern>
    <clipPath id="c2clip"><rect x="25" y="22" width="400" height="220" rx="18"/></clipPath>
    <filter id="c2b" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="c2b3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- floor shadow + coloured light spill -->
  <ellipse cx="231" cy="269" rx="184" ry="9" fill="#000" opacity="0.55" filter="url(#c2b)">
    <animate attributeName="rx" values="184;160;184" dur="5s" begin="-1.7s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="225" cy="267" rx="136" ry="7" fill="#6DB33F" opacity="0.28" filter="url(#c2b)"/>

  <g transform="translate(225.0 132.0) skewY(-2.6) scale(0.97 1) translate(-225.0 -132.0)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" begin="-1.7s" repeatCount="indefinite"/>
      <rect x="34.0" y="35.0" width="400" height="220" rx="18" fill="#1f3212"/><rect x="33.0" y="33.6" width="400" height="220" rx="18" fill="#203314"/><rect x="32.0" y="32.1" width="400" height="220" rx="18" fill="#223515"/><rect x="31.0" y="30.7" width="400" height="220" rx="18" fill="#233617"/><rect x="30.0" y="29.2" width="400" height="220" rx="18" fill="#253718"/><rect x="29.0" y="27.8" width="400" height="220" rx="18" fill="#26391a"/><rect x="28.0" y="26.3" width="400" height="220" rx="18" fill="#283a1b"/><rect x="27.0" y="24.9" width="400" height="220" rx="18" fill="#293c1d"/><rect x="26.0" y="23.4" width="400" height="220" rx="18" fill="#2b3d1f"/><rect x="34.0" y="35.0" width="400" height="220" rx="18" fill="none" stroke="#6DB33F" stroke-opacity="0.55" stroke-width="1.2"/>

      <!-- front face -->
      <rect x="25" y="22" width="400" height="220" rx="18" fill="url(#c2face)"/>
      <rect x="25" y="22" width="400" height="220" rx="18" fill="url(#c2glow)"/>
      <rect x="25" y="22" width="400" height="220" rx="18" fill="url(#c2scan)"/>

      <g clip-path="url(#c2clip)">
        <!-- faint orbit rings, top-right -->
        <g transform="translate(363 80)" fill="none" stroke="#6DB33F">
          <circle r="34" stroke-opacity="0.22" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="26s" repeatCount="indefinite"/></circle>
          <circle r="52" stroke-opacity="0.14" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="38s" repeatCount="indefinite"/></circle>
          <circle r="70" stroke-opacity="0.09"/>
        </g>
        <!-- light sweep -->
        <g><animateTransform attributeName="transform" type="translate" values="-150 0;-150 0;550 0" keyTimes="0;0.55;1" dur="7s" begin="-2.7s" repeatCount="indefinite"/>
          <rect x="-15" y="12" width="90" height="240" fill="url(#c2shine)" transform="skewX(-22)"/></g>
      </g>

      <!-- top-edge highlight + neon border -->
      <path d="M43,23.5 H407" stroke="#fff" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="25" y="22" width="400" height="220" rx="18" fill="none" stroke="#6DB33F" stroke-width="3" opacity="0.4" filter="url(#c2b3)"/>
      <rect x="25" y="22" width="400" height="220" rx="18" fill="none" stroke="#6DB33F" stroke-opacity="0.8" stroke-width="1.4"/>

      <!-- icon tile (little extruded block) -->
      <g transform="translate(51 48)">
        <rect x="5" y="7" width="58" height="58" rx="15" fill="#1f3212"/>
        <rect x="2.5" y="3.5" width="58" height="58" rx="15" fill="#365a20"/>
        <rect width="58" height="58" rx="15" fill="url(#c2tile)"/>
        <rect width="58" height="58" rx="15" fill="none" stroke="#fff" stroke-opacity="0.45"/>
        <text x="29" y="40" text-anchor="middle" class="e" font-size="30">🩺</text>
      </g>

      <!-- title -->
      <text x="129" y="72" class="sans" font-size="22" font-weight="800" fill="#f0f6fc">WireDoctor</text>
      <rect x="129" y="82" width="108" height="3" rx="1.5" fill="#6DB33F"/>
      <g transform="translate(25 20)"><text x="26" y="116" class="sans" font-size="14" fill="#aab6c3">Spring Boot context diagnostics &amp; CI gating.</text></g>
      <line x1="51" y1="172" x2="399" y2="172" stroke="#1f2a3a"/>
      <g transform="translate(25 22)"><g transform="translate(26 172)"><rect width="60" height="28" rx="14" fill="#0b1018" stroke="#6DB33F" stroke-opacity="0.55"/><circle cx="15" cy="14" r="4" fill="#6DB33F"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="-0.74s" repeatCount="indefinite"/></circle><text x="26" y="18.5" class="b" font-size="12" fill="#e6edf3">Java</text></g><g transform="translate(96 172)"><rect width="96" height="28" rx="14" fill="#6DB33F"/><rect width="96" height="28" rx="14" fill="url(#c2hi)"/><text x="48" y="18.5" text-anchor="middle" class="b" font-size="12" fill="#0d1117">Tarjan SCC</text></g></g>

      <!-- corner brackets -->
      <path d="M385,36 H411 V62" fill="none" stroke="#6DB33F" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
      <path d="M385,228 H411 V202" fill="none" stroke="#6DB33F" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>
</svg>
