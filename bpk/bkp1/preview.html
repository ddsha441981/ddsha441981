<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Deendayal Kumawat — Profile Preview</title>
<style>
  :root{--bg:#0d1117;--panel:#010409;--text:#e6edf3;--muted:#8b98a5;--line:#1f2a3a;--accent:#ff6b00;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px;}
  .wrap{width:100%;max-width:880px;}
  h1{font-size:18px;font-weight:800;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px;
    font-family:ui-monospace,'JetBrains Mono',monospace}
  .note{color:var(--muted);font-size:12px;border:1px dashed var(--line);
    border-radius:10px;padding:10px 14px;margin:0 0 24px;line-height:1.6}
  .note b{color:var(--accent)}
  img{width:100%;display:block;margin:0 0 22px;border-radius:16px}
  footer{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}
  a{color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap">
    <h1>GitHub Profile Preview — local render</h1>
    <p class="sub">renders exactly like github.com/ddsha441981 · CSS + SMIL only</p>
    <img src="assets/hero.svg?v=2" alt="hero"/>
    <img src="assets/about-life.svg?v=2" alt="about"/>
    <img src="assets/stack.svg?v=2" alt="stack"/>
    <img src="assets/id-dashboard.svg?v=2" alt="id badge"/>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 4px;margin:0 0 22px"><img src="assets/projects/project-lethe.svg?v=2" alt="project-lethe" style="margin:0;border-radius:0"/><img src="assets/projects/cl-tds.svg?v=2" alt="cl-tds" style="margin:0;border-radius:0"/><img src="assets/projects/wiredoctor.svg?v=2" alt="wiredoctor" style="margin:0;border-radius:0"/><img src="assets/projects/linefault.svg?v=2" alt="linefault" style="margin:0;border-radius:0"/><img src="assets/projects/pulse-map.svg?v=2" alt="pulse-map" style="margin:0;border-radius:0"/><img src="assets/projects/sketchboot.svg?v=2" alt="sketchboot" style="margin:0;border-radius:0"/><img src="assets/projects/struct-mapper.svg?v=2" alt="struct-mapper" style="margin:0;border-radius:0"/><img src="assets/projects/voxora.svg?v=2" alt="voxora" style="margin:0;border-radius:0"/><img src="assets/projects/godseye.svg?v=2" alt="godseye" style="margin:0;border-radius:0"/><img src="assets/projects/magnetic-math-universe.svg?v=2" alt="magnetic-math-universe" style="margin:0;border-radius:0"/></div>
    <img src="assets/connect.svg?v=2" alt="connect"/>
    <footer>Reload to replay the intro animations. Swap the photo later with <code>python tools/embed_photo.py photo.jpg assets/id-dashboard.svg</code>.</footer>
  </div>
</body>
</html>
